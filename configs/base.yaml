run:
  seed: 42
  artifacts_dir: artifacts
  log_level: INFO

data:
  raw_path: ../data/raw/telco_churn.csv
  target: Churn
  test_size: 0.2

features:
  drop_cols: ["customerID"]
  numeric_impute: median
  categorical_impute: most_frequent
  scaling: standard
  one_hot: true

model:
  name: logistic_regression
  params:
    max_iter: 1000